name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Validate version tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Validating tag: ${TAG_NAME}"
          if ! [[ "${TAG_NAME}" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: Tag '${TAG_NAME}' does not follow semver format (e.g. v1.1 or v1.1.0)"
            exit 1
          fi

      - name: Verify code formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not properly formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run all tests with race detector
        run: go test -v -race ./...

      - name: Build Linux amd64 binary
        run: |
          go run scripts/build.go -os linux -arch amd64 -version "${{ github.ref_name }}" -output dist/alphadrive-linux-amd64

      - name: Build Linux arm64 binary
        run: |
          go run scripts/build.go -os linux -arch arm64 -version "${{ github.ref_name }}" -output dist/alphadrive-linux-arm64

      - name: Verify build artifacts
        run: |
          if [ ! -s dist/alphadrive-linux-amd64 ]; then
            echo "Error: Linux amd64 binary is missing or empty"
            exit 1
          fi
          if [ ! -s dist/alphadrive-linux-arm64 ]; then
            echo "Error: Linux arm64 binary is missing or empty"
            exit 1
          fi

      - name: Validate built binary and production assets
        run: |
          chmod +x dist/alphadrive-linux-amd64
          ./dist/alphadrive-linux-amd64 --version
          ALPHADRIVE_LISTEN_ADDRESS="127.0.0.1:18080" ALPHADRIVE_DATA_DIR="$(mktemp -d)" ./dist/alphadrive-linux-amd64 serve &
          SERVER_PID=$!
          sleep 2
          curl -sI http://127.0.0.1:18080/setup | grep -i "content-type: text/html"
          curl -sI http://127.0.0.1:18080/static/css/app.css | grep -i "content-type: text/css"
          curl -sI http://127.0.0.1:18080/static/js/app.js | grep -i "content-type:"
          curl -sI http://127.0.0.1:18080/static/images/logo.png | grep -i "content-type: image/png"
          CSS_OUT=$(curl -s http://127.0.0.1:18080/static/css/app.css)
          echo "$CSS_OUT" | grep -F ".auth-page"
          echo "$CSS_OUT" | grep -F ".auth-shell"
          echo "$CSS_OUT" | grep -F ".auth-brand"
          echo "$CSS_OUT" | grep -F ".auth-logo"
          echo "$CSS_OUT" | grep -F ".auth-title"
          echo "$CSS_OUT" | grep -F ".auth-card"
          echo "$CSS_OUT" | grep -F ".form-group"
          echo "$CSS_OUT" | grep -F ".btn-submit"
          kill $SERVER_PID || true

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum alphadrive-linux-amd64 alphadrive-linux-arm64 > checksums.txt
          echo "Generated SHA256 Checksums:"
          cat checksums.txt

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/alphadrive-linux-amd64
            dist/alphadrive-linux-arm64
            dist/checksums.txt
          generate_release_notes: true
          name: "AlphaDrive ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
