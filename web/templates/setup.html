<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Owner Setup — alphadrive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="icon" type="image/png" href="/static/images/logo.png">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-brand">
            <img class="auth-brand-icon" src="/static/images/logo.png" alt="alphadrive">
            <span class="auth-brand-text">alphadrive</span>
        </div>
        <h1 class="auth-title">Setup owner account</h1>
        <div class="auth-card">
            {{if .Error}}
            <p class="auth-error">{{.Error}}</p>
            {{end}}
            <form method="post" action="/setup">
                <input type="hidden" name="csrf" value="{{.CSRF}}">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input id="name" name="name" autocomplete="name" value="{{.Name}}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" autocomplete="username" value="{{.Username}}" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" required>
                </div>
                <button class="btn-submit" type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
