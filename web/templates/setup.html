<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Owner Setup — alphadrive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="icon" type="image/png" href="/static/images/logo.png">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <img class="auth-logo" src="/static/images/logo.png" alt="alphadrive">
        <h1 class="auth-title">Owner Setup</h1>
        <div class="auth-card">
            {{if .Error}}
            <p class="auth-error">{{.Error}}</p>
            {{end}}
            <form method="post" action="/setup">
                <input type="hidden" name="csrf" value="{{.CSRF}}">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input id="name" name="name" autocomplete="name" placeholder="Admin" value="{{.Name}}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" autocomplete="username" placeholder="admin" value="{{.Username}}" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" autocomplete="new-password" placeholder="At least 12 characters" minlength="12" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" placeholder="Repeat your password" minlength="12" required>
                </div>
                <button class="btn-submit" type="submit">Create Owner Account</button>
            </form>
        </div>
    </div>
</body>
</html>
